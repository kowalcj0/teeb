[project]
name = "teeb"
version = "0.1.0"
description = "Simple music album pre-tagging cleaner."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chardet",
    "send2trash",
    "wand",
]

[dependency-groups]
dev = [
    "basedpyright",
    "behave",
    "ipdb",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty>=0.0.11",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
pythonpath = [
  "src"
]
testpaths = [
    "tests",
]

[tool.uv]
package=true

[tool.basedpyright]
venvPath = "."
venv = ".venv"
include = ["src"]
reportMissingTypeStubs = false
executionEnvironments = [
  { root = "src/tests", reportPrivateUsage = false},
  { root = "src" }
]
